<th:block th:fragment="navbar">
    <nav class="navbar navbar-expand-lg fixed-top pixel-border-top pixel-bg-dark">
        <div class="container-fluid">
            <!-- Logo / Nombre del sistema -->
            <a class="navbar-brand pixel-title" th:href="@{/}">⚡CODE·ARENA⚡</a>

            <!-- Botón para móviles -->
            <button class="navbar-toggler pixel-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Contenido colapsable -->
            <div class="collapse navbar-collapse" id="mainNavbar">
                <!-- Enlaces dinámicos según el rol -->
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <!-- SI NO HA INICIADO SESIÓN -->
                    <th:block th:unless="${session.userRole}">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/login}">Iniciar Sesión</a>
                        </li>
                    </th:block>

                    <!-- ROL ESTUDIANTE -->
                    <th:block th:if="${session.userRole == 'ESTUDIANTE'}">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/estudiante/search-competitions}">🔍 Búsqueda de competencias</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/estudiante/rankings}">🏆 Ranking general</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/estudiante/my-enrollments}">📋 Mis inscripciones</a>
                        </li>
                    </th:block>

                    <!-- ROL ADMINISTRADOR -->
                    <th:block th:if="${session.userRole == 'ADMINISTRADOR'}">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/manage-users}">👥 Gestión de usuarios</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/manage-competitions}">🏁 CRUD Competencias</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/manage-problems}">📝 CRUD Problemas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/manage-testcases}">🧪 Casos de prueba</a>
                        </li>
                    </th:block>
                </ul>

                <!-- Menú de usuario (dropdown) cuando está logueado -->
                <ul class="navbar-nav" th:if="${session.userRole}">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle pixel-dropdown" href="#" id="userMenu" role="button"
                           data-bs-toggle="dropdown">
                            <span th:text="${session.userAvatar}">A</span>
                            <span th:text="${session.username}">Usuario</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end pixel-dropdown-menu">
                            <li><a class="dropdown-item" th:href="@{/profile}">👤 Perfil de usuario</a></li>
                            <li><a class="dropdown-item" th:href="@{/profile/edit}"> Editar perfil</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" th:href="@{/logout}"> Cerrar sesión</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</th:block>
