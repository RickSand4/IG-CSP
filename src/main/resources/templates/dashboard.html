<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | Code Arena</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/retro-bit.css}">
</head>
<body class="crt">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="pixel-panel p-4 text-center">
        <h1 class="pixel-title mb-4">LOBBY PRINCIPAL</h1>
        <p style="font-family: 'VT323', monospace; font-size: 1.8rem; color: #8effd2;">
            Bienvenido, <span th:text="${session.username}" style="color: #f2d96c;">Usuario</span>
        </p>

        <div class="row mt-4 mb-5" th:if="${session.userRole == 'ESTUDIANTE'}">
            <div class="col-md-4">
                <div class="pixel-border p-3 h-100">
                    <h5 style="color: #3cd0e0; font-family: 'Press Start 2P', cursive; font-size: 0.7rem;">🏆 RANGO</h5>
                    <p style="font-family: 'VT323', monospace; font-size: 1.5rem; margin: 0;">Nivel 8</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="pixel-border p-3 h-100">
                    <h5 style="color: #3cd0e0; font-family: 'Press Start 2P', cursive; font-size: 0.7rem;">🔥 RACHA</h5>
                    <p style="font-family: 'VT323', monospace; font-size: 1.5rem; margin: 0;">7 Días</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="pixel-border p-3 h-100">
                    <h5 style="color: #3cd0e0; font-family: 'Press Start 2P', cursive; font-size: 0.7rem;">⚔️ VICTORIAS</h5>
                    <p style="font-family: 'VT323', monospace; font-size: 1.5rem; margin: 0;">12</p>
                </div>
            </div>
        </div>

        <h2 class="panel-title mb-4 mt-4" style="border-bottom: none;">CONTROL DE MISIÓN</h2>
        <div class="row g-4 justify-content-center">
            <div class="col-md-5">
                <div class="pixel-border d-flex flex-column justify-content-between h-100">
                    <div>
                        <h3 class="panel-title">COMPETIR</h3>
                        <p style="color: #aacad0;">Entra a la arena y demuestra tus habilidades.</p>
                    </div>
                    <a th:href="@{/arena}" class="btn-pixel w-100 text-decoration-none mt-3">▶ ENTRAR ARENA</a>
                </div>
            </div>

            <div class="col-md-5">
                <div class="pixel-border d-flex flex-column justify-content-between h-100">
                    <div>
                        <h3 class="panel-title">ESTADÍSTICAS</h3>
                        <p style="color: #aacad0;">Revisa tu posición en el ranking global de la plataforma.</p>
                    </div>
                    <a th:href="@{/estudiante/rankings}" class="btn-pixel secondary w-100 text-decoration-none mt-3">🏆 VER RANKING</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
