<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Login | Code Arena</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/retro-bit.css}">
</head>
<body class="crt">
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-4 pixel-panel p-4">
      <h3 class="pixel-title text-center">⚡ INGRESAR ⚡</h3>
      <div th:if="${error}" class="alert alert-danger pixel-alert" th:text="${error}"></div>
      <form th:action="@{/login}" method="post">
        <div class="mb-3">
          <label class="form-label pixel-label">Usuario</label>
          <input type="text" name="username" class="form-control pixel-input" required>
        </div>
        <div class="mb-3">
          <label class="form-label pixel-label">Contraseña</label>
          <input type="password" name="password" class="form-control pixel-input" required>
        </div>
        <button type="submit" class="btn-pixel w-100">ENTRAR</button>
      </form>
      <p class="mt-3 text-center pixel-small">Usuarios de prueba: estudiante / admin (contraseña: 1234)</p>
    </div>
  </div>
</div>
</body>
</html>
