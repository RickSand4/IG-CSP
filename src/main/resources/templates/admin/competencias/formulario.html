<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Competencia | Code Arena</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/retro-bit.css}">
</head>
<body class="crt">
<div th:replace="~{Fragments/navbar :: navbar}"></div>

<div class="container mt-5 pt-4">
    <div class="pixel-panel p-4">
        <h2 class="pixel-title mb-4" th:text="${competencia.id == null ? 'NUEVA COMPETENCIA' : 'EDITAR COMPETENCIA'}">Título</h2>

        <form th:action="@{${competencia.id == null ? '/admin/competencias/nueva' : '/admin/competencias/' + competencia.id + '/editar'}}"
              th:object="${competencia}" method="post">
            <div class="mb-3">
                <label class="form-label" style="color:#3cd0e0;">Título</label>
                <input type="text" class="form-control pixel-input" th:field="*{titulo}" required>
            </div>
            <div class="mb-3">
                <label class="form-label" style="color:#3cd0e0;">Descripción</label>
                <textarea class="form-control pixel-input" th:field="*{descripcion}" rows="3"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label" style="color:#3cd0e0;">Estado</label>
                <select class="form-select pixel-input" th:field="*{estado}">
                    <option th:each="estado : ${estados}" th:value="${estado}" th:text="${estado}"></option>
                </select>
            </div>
            <button type="submit" class="btn-pixel">GUARDAR</button>
            <a th:href="@{/admin/competencias}" class="btn-pixel secondary">CANCELAR</a>
        </form>
    </div>
</div>

<script th:src="@{/webjars/jquery/jquery.min.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
