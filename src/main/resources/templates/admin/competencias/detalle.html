<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle Competencia | Code Arena</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/retro-bit.css}">
</head>
<body class="crt">
<div th:replace="~{Fragments/navbar :: navbar}"></div>

<div class="container mt-5 pt-4">
    <div class="pixel-panel p-4">
        <h1 class="pixel-title mb-3" th:text="${competencia.titulo}">Título</h1>
        <p><strong>Estado:</strong> <span th:text="${competencia.estado}"></span></p>
        <p><strong>Descripción:</strong> <span th:text="${competencia.descripcion}"></span></p>
        <p><strong>Fecha creación:</strong> <span th:text="${#temporals.format(competencia.fechaCreacion, 'dd/MM/yyyy')}"></span></p>
        <a th:href="@{/admin/competencias/{id}/editar(id=${competencia.id})}" class="btn btn-warning">✏️ Editar</a>
        <a th:href="@{/admin/competencias}" class="btn btn-secondary">Volver</a>
    </div>
</div>

<script th:src="@{/webjars/jquery/jquery.min.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
