<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Perfil | Code Arena</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/retro-bit.css}">
</head>
<body class="crt">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5 pt-4">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="pixel-panel p-4 text-center">
        <h2 class="pixel-title mb-4">👤 PERFIL DE <span th:text="${session.username}" style="color: #f2d96c;">USUARIO</span></h2>

        <div class="mb-4 pixel-border p-3">
          <p style="font-family: 'Press Start 2P', cursive; font-size: 0.7rem; color: #3cd0e0;">ROL</p>
          <p style="font-size: 1.5rem; color: #b0f0d0;" th:text="${session.userRole}">Rol</p>

          <p style="font-family: 'Press Start 2P', cursive; font-size: 0.7rem; color: #3cd0e0; margin-top: 15px;">AVATAR</p>
          <p style="font-size: 2rem; color: #b0f0d0;" th:text="${session.userAvatar}">A</p>
        </div>

        <a th:href="@{/profile/edit}" class="btn-pixel w-100 text-decoration-none d-inline-block"> EDITAR PERFIL</a>
      </div>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
