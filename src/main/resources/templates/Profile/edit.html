<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Editar Perfil | Code Arena</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/retro-bit.css}">
</head>
<body class="crt">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="pixel-panel p-4">
        <h2 class="pixel-title text-center mb-4"> EDITAR PERFIL</h2>
        <form>
          <div class="mb-4">
            <label class="form-label" style="color: #3cd0e0; font-family: 'Press Start 2P', cursive; font-size: 0.7rem;">NUEVO NOMBRE</label>
            <input type="text" class="form-control pixel-input" th:value="${session.username}">
          </div>
          <button type="submit" class="btn-pixel w-100">GUARDAR CAMBIOS</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
